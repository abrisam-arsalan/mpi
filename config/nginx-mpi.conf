# Portal MPI — mpi.smp5tegal.sch.id
# Origin di belakang Cloudflare Tunnel, cukup listen 80 (HTTPS ditangani Cloudflare).
server {
    listen 80;
    listen [::]:80;
    server_name mpi.smp5tegal.sch.id;

    root /var/www/mpi/portal;
    index index.php index.html;

    client_max_body_size 20m;

    # Gzip untuk HTML/JSON/CSS/JS
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # File game (HTML statis) dilayani langsung
    location /game/ {
        try_files $uri $uri/ =404;
    }

    # PHP-FPM
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param HTTPS off; # origin HTTP di belakang tunnel
    }

    # Blokir file sensitif / berkas sumber yang tak boleh diakses publik
    location ~* \.(sql|md|example|ini|log|sh|bak)$ {
        deny all;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
